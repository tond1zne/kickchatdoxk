<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick Chat + 7TV</title>
<style>
:root{
  --accent:#53fc18; --text:#f1f1f6; --muted:#9a9aab;
  --glass:rgba(18,18,24,.62); --panel:rgba(22,22,30,.96); --border:rgba(255,255,255,.09);
  --fs:16px; --bgo:.35;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--text);
  font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;position:relative;background:rgba(8,8,12,var(--bgo))}
#bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--border);
  transform:translateY(-100%);opacity:0;transition:.2s}
#app:hover #bar,#bar.pin{transform:none;opacity:1}
#dot{width:9px;height:9px;border-radius:50%;background:#666;flex:none}
#dot.ok{background:var(--accent);box-shadow:0 0 8px var(--accent)}
#dot.bad{background:#ff4d4d}
#ch{flex:1;font-weight:600;font-size:13px}
.btn{background:var(--accent);color:#06210a;border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer}
.btn.sec{background:#2b2b36;color:var(--text)}
input[type=text],input[type=password],input[type=number]{background:#101015;border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;outline:none}
input:focus{border-color:var(--accent)}
#gear{cursor:pointer;color:var(--muted);font-size:17px;user-select:none}
#settings{display:none;position:absolute;top:40px;left:8px;right:8px;z-index:6;max-height:calc(100% - 100px);
  overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;
  flex-direction:column;gap:8px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#settings.open{display:flex}
#settings label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted)}
#settings h4{margin:6px 0 0;color:var(--text);font-size:12px}
#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
#chat::-webkit-scrollbar{width:0}
.msg{align-self:flex-start;max-width:100%;font-size:var(--fs);line-height:1.5;word-wrap:break-word;
  background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--border);
  border-left:3px solid var(--c,var(--accent));border-radius:4px 12px 12px 4px;padding:5px 11px;
  text-shadow:0 1px 2px rgba(0,0,0,.5);animation:in .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateX(-12px) scale(.97)}to{opacity:1;transform:none}}
.user{font-weight:800;margin-right:5px}
.badge{display:inline-block;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;margin-right:4px;
  vertical-align:middle;background:#444;color:#fff;letter-spacing:.4px}
.badge.mod{background:#00c7ac;color:#012}.badge.vip{background:#e5b300;color:#211900}
.badge.sub{background:#7a4cff}.badge.host{background:var(--accent);color:#06210a}
img.emote{height:calc(var(--fs) + 12px);vertical-align:middle;margin:-4px 2px}
.msg.sys{color:var(--muted);font-style:italic;font-size:12px;border-left-color:#555}
#compose{display:flex;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--border);
  transform:translateY(100%);opacity:0;transition:.2s;position:absolute;bottom:0;left:0;right:0}
#app:hover #compose,#compose:focus-within{transform:none;opacity:1}
#msgIn{flex:1;font-size:13px;border-radius:20px;padding:8px 14px}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span id="dot"></span><span id="ch"></span>
    <span id="auth" style="font-size:11px;color:var(--muted)"></span>
    <button class="btn" id="loginBtn">Přihlásit</button>
    <span id="gear" title="Nastavení">⚙</span>
  </div>

  <div id="settings">
    <label>Velikost písma <input id="fs" type="range" min="11" max="30" value="16"></label>
    <label>Průhlednost pozadí <input id="bgo" type="range" min="0" max="100" value="35"></label>
    <label>Kanál <input id="slug" type="text" style="width:150px"></label>
    <h4>Kick appka (kick.com/settings/developer)</h4>
    <label>Client ID <input id="cid" type="text" style="width:210px"></label>
    <label>Client Secret <input id="sec" type="password" style="width:210px"></label>
    <label>Redirect URI (nastav stejné v appce) <input id="redir" type="text" style="width:210px" readonly></label>
    <h4>Ruční ID (jen když se samo nenajde)</h4>
    <label>Chatroom ID <input id="mcr" type="text" style="width:110px"></label>
    <label>Kick user ID <input id="muid" type="text" style="width:110px"></label>
    <h4>Přihlášení do OBS docku (když OBS nepustí Kick login)</h4>
    <label>Refresh token <input id="rt" type="text" style="width:210px" placeholder="vlož / zkopíruj"></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn" id="useRt">Použít token</button>
      <button class="btn sec" id="saveBtn">Uložit a připojit</button>
      <button class="btn sec" id="logoutBtn">Odhlásit</button>
      <button class="btn sec" id="clearBtn">Vymazat chat</button>
    </div>
  </div>

  <div id="chat"></div>

  <div id="compose">
    <input id="msgIn" type="text" placeholder="Přihlas se (⚙) a piš…" disabled>
    <button class="btn" id="sendBtn" disabled>Odeslat</button>
  </div>
</div>

<script>
(function(){
const $ = id => document.getElementById(id);
const DEFAULT_CHANNEL = 'tond1zne';
const REDIRECT = 'https://chatdock-1.vercel.app/';
const PUSHER = 'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false';
const LS = {
  get:(k,d='')=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
const chat=$('chat'); let ws=null, rt=null, delay=2000, emotes=new Map(), broadcaster=null, session=null;

$('redir').value=REDIRECT;
$('cid').value=LS.get('kd_cid'); $('sec').value=LS.get('kd_sec');
$('mcr').value=LS.get('kd_mcr'); $('muid').value=LS.get('kd_muid');
$('fs').value=LS.get('kd_fs','16'); $('bgo').value=LS.get('kd_bgo','35');
const params=new URLSearchParams(location.search);
$('slug').value=params.get('channel')||LS.get('kd_slug',DEFAULT_CHANNEL);

function applyLook(){
  document.documentElement.style.setProperty('--fs',$('fs').value+'px');
  document.documentElement.style.setProperty('--bgo',$('bgo').value/100);
  LS.set('kd_fs',$('fs').value); LS.set('kd_bgo',$('bgo').value);
}
$('fs').oninput=$('bgo').oninput=applyLook; applyLook();
$('gear').onclick=()=>{const o=$('settings').classList.toggle('open');$('bar').classList.toggle('pin',o)};
$('clearBtn').onclick=()=>chat.innerHTML='';

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function scroll(){while(chat.children.length>120)chat.removeChild(chat.firstChild);chat.scrollTop=chat.scrollHeight}
function sys(t){const d=document.createElement('div');d.className='msg sys';d.textContent=t;chat.appendChild(d);scroll()}
const status=s=>$('dot').className=s;

/* ---------- načtení dat (s proxy fallbacky) ---------- */
const PROXIES=[u=>u,u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
  u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
  u=>'https://thingproxy.freeboard.io/fetch/'+u];
async function getJson(url){
  let err;
  for(const p of PROXIES){
    try{const r=await fetch(p(url),{headers:{Accept:'application/json'}});
      if(!r.ok)throw 0;const d=await r.json();if(d&&typeof d==='object')return d;}catch(e){err=e}
  }
  throw err||new Error('fetch');
}
async function resolve(slug){
  const cache=JSON.parse(LS.get('kd_cache_'+slug,'null')||'null');
  if(cache&&cache.chatroomId)return cache;
  const d=await getJson('https://kick.com/api/v2/channels/'+encodeURIComponent(slug));
  const out={chatroomId:d.chatroom&&d.chatroom.id,userId:d.user_id};
  if(!out.chatroomId)throw new Error('no id');
  LS.set('kd_cache_'+slug,JSON.stringify(out)); return out;
}
async function load7tv(uid){
  emotes.clear(); if(!uid)return;
  try{
    const d=await getJson('https://7tv.io/v3/users/kick/'+uid);
    ((d.emote_set&&d.emote_set.emotes)||[]).forEach(e=>emotes.set(e.name,`https://cdn.7tv.app/emote/${e.id}/3x.webp`));
    sys('7TV emoty: '+emotes.size);
  }catch(e){sys('7TV emoty se nenačetly.')}
}

/* ---------- vykreslení zpráv ---------- */
function badges(s){
  return(((s||{}).identity||{}).badges||[]).map(b=>{
    const t=(b.type||'').toLowerCase();
    const m=t.includes('mod')?['mod','MOD']:t.includes('vip')?['vip','VIP']:t.includes('sub')?['sub','SUB']:
      (t.includes('broadcaster')||t.includes('host'))?['host','HOST']:null;
    return m?`<span class="badge ${m[0]}">${m[1]}</span>`:'';
  }).join('');
}
function content(raw){
  const re=/\[emote:(\d+):([^\]]+)\]/g;let last=0,m,parts=[];
  while((m=re.exec(raw))){parts.push(['t',raw.slice(last,m.index)]);parts.push(['k',m[1],m[2]]);last=re.lastIndex}
  parts.push(['t',raw.slice(last)]);
  return parts.map(p=>{
    if(p[0]==='k')return `<img class="emote" src="https://files.kick.com/emotes/${p[1]}/fullsize" alt="${esc(p[2])}">`;
    return p[1].split(/(\s+)/).map(w=>emotes.has(w)?`<img class="emote" src="${emotes.get(w)}" alt="${esc(w)}">`:esc(w)).join('');
  }).join('');
}
function addMsg(d){
  const s=d.sender||{},c=(s.identity&&s.identity.color)||'#53fc18';
  const el=document.createElement('div');el.className='msg';el.style.setProperty('--c',c);
  el.innerHTML=`${badges(s)}<span class="user" style="color:${esc(c)}">${esc(s.username||'???')}</span>${content(d.content||'')}`;
  chat.appendChild(el);scroll();
}

/* ---------- websocket ---------- */
function wsConnect(id){
  clearTimeout(rt);if(ws){try{ws.onclose=null;ws.close()}catch(e){}}
  ws=new WebSocket(PUSHER);
  ws.onopen=()=>ws.send(JSON.stringify({event:'pusher:subscribe',data:{auth:'',channel:`chatrooms.${id}.v2`}}));
  ws.onmessage=e=>{
    let o;try{o=JSON.parse(e.data)}catch(x){return}
    if(o.event==='pusher:connection_established'){status('ok');sys('Připojeno ✅');delay=2000}
    else if(o.event==='pusher:ping')ws.send(JSON.stringify({event:'pusher:pong',data:{}}));
    else if(/ChatMessage/.test(o.event)){try{addMsg(JSON.parse(o.data))}catch(x){}}
  };
  ws.onclose=()=>{status('bad');rt=setTimeout(()=>wsConnect(id),delay);delay=Math.min(delay*1.5,30000)};
  ws.onerror=()=>status('bad');
}
async function connect(){
  const slug=$('slug').value.trim()||DEFAULT_CHANNEL;
  LS.set('kd_slug',slug);$('ch').textContent='kick.com/'+slug;
  chat.innerHTML='';status('');sys('Připojuji se ke kanálu '+slug+'…');
  let cr=$('mcr').value.trim(),uid=$('muid').value.trim();
  if(!cr||!uid){
    try{const r=await resolve(slug);cr=cr||r.chatroomId;uid=uid||r.userId}
    catch(e){status('bad');sys('Kick blokuje zjištění ID. Otevři ⚙ a vlož Chatroom ID + user ID (kick.com/api/v2/channels/'+slug+').');$('settings').classList.add('open');$('bar').classList.add('pin');return}
  }
  LS.set('kd_cache_'+slug,JSON.stringify({chatroomId:cr,userId:uid}));
  broadcaster=uid;
  await load7tv(uid);wsConnect(cr);
}
$('saveBtn').onclick=()=>{
  LS.set('kd_cid',$('cid').value.trim());LS.set('kd_sec',$('sec').value.trim());
  LS.set('kd_mcr',$('mcr').value.trim());LS.set('kd_muid',$('muid').value.trim());
  connect();
};

/* ---------- OAuth (PKCE), přihlášení se pamatuje vždy ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a).slice(0,n)};
function save(){session?LS.set('kd_session',JSON.stringify(session)):LS.del('kd_session')}
function ui(){
  const on=!!session;
  $('msgIn').disabled=$('sendBtn').disabled=!on;
  $('msgIn').placeholder=on?'Napiš zprávu…':'Přihlas se (⚙) a piš…';
  $('auth').textContent=on?'přihlášen ✅':'';
  $('loginBtn').style.display=on?'none':'';
  if(on)$('rt').value=session.refresh_token||'';
}
async function tokenReq(body){
  const cid=($('cid').value||LS.get('kd_cid')).trim(),sec=($('sec').value||LS.get('kd_sec')).trim();
  body.set('client_id',cid);if(sec)body.set('client_secret',sec);
  const r=await fetch('https://id.kick.com/oauth/token',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,120));
  return r.json();
}
function setSession(d,oldRt){
  session={access_token:d.access_token,refresh_token:d.refresh_token||oldRt,expires_at:Date.now()+(d.expires_in||3600)*1000};
  save();ui();
}
async function refresh(force){
  if(!session)return;
  if(!force&&Date.now()<session.expires_at-120000)return;
  const b=new URLSearchParams({grant_type:'refresh_token',refresh_token:session.refresh_token});
  setSession(await tokenReq(b),session.refresh_token);
}
$('loginBtn').onclick=async()=>{
  const cid=$('cid').value.trim();
  if(!cid){alert('Nejdřív vyplň Client ID v ⚙.');return}
  LS.set('kd_cid',cid);LS.set('kd_sec',$('sec').value.trim());
  const v=rnd(64),st=rnd(24);
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  LS.set('kd_verifier',v);LS.set('kd_state',st);
  const u=new URL('https://id.kick.com/oauth/authorize');
  u.search=new URLSearchParams({client_id:cid,redirect_uri:REDIRECT,response_type:'code',
    scope:'chat:write',code_challenge:ch,code_challenge_method:'S256',state:st});
  location.href=u.toString();
};
$('logoutBtn').onclick=()=>{session=null;save();ui()};
$('useRt').onclick=async()=>{
  const t=$('rt').value.trim();if(!t)return;
  try{setSession(await tokenReq(new URLSearchParams({grant_type:'refresh_token',refresh_token:t})),t);sys('Přihlášení tokenem OK ✅')}
  catch(e){sys('Token nejde použít: '+e.message)}
};

async function send(){
  const t=$('msgIn').value.trim();if(!t||!session)return;
  if(!broadcaster){sys('Chvilku, ještě se připojuji ke kanálu.');return}
  try{await refresh()}catch(e){sys('Přihlášení vypršelo, přihlas se znovu.');session=null;save();ui();return}
  try{
    const r=await fetch('https://api.kick.com/public/v1/chat',{method:'POST',
      headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({broadcaster_user_id:Number(broadcaster),content:t,type:'user'})});
    if(!r.ok){sys('Odeslání selhalo ('+r.status+'): '+(await r.text()).slice(0,150));return}
    $('msgIn').value='';
  }catch(e){sys('Odeslání selhalo (síť/CORS).')}
}
$('sendBtn').onclick=send;
$('msgIn').onkeydown=e=>{if(e.key==='Enter')send()};

/* ---------- start ---------- */
(async function init(){
  try{session=JSON.parse(LS.get('kd_session','null')||'null')}catch(e){}
  const code=params.get('code'),st=params.get('state');
  if(code){
    history.replaceState({},'',location.pathname);
    if(st&&st===LS.get('kd_state')){
      try{
        setSession(await tokenReq(new URLSearchParams({grant_type:'authorization_code',redirect_uri:REDIRECT,
          code_verifier:LS.get('kd_verifier'),code})));
        sys('Přihlášení úspěšné ✅');
      }catch(e){sys('Přihlášení selhalo: '+e.message)}
    }else sys('Neplatný state, přihlášení zrušeno.');
  }
  ui();
  connect();
  if(session)refresh().catch(()=>{});
  setInterval(()=>refresh().catch(()=>{}),5*60*1000); // udržuje přihlášení naživu
})();
})();
</script>
</body>
</html>
